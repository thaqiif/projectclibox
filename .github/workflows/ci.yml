name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  check:
    # Self-hosted: never run code from fork PRs on the runner's machine.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Self-hosted runners may lack sudo; tmux just has to be on PATH.
      - run: command -v tmux || (sudo apt-get update && sudo apt-get install -y tmux)
      - run: npm ci --include=dev --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  installer:
    # Self-hosted: never run code from fork PRs on the runner's machine.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh
      - run: ./install.sh --dry-run --yes
