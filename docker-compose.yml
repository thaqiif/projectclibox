services:
  cliweb:
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      CLIWEB_PORT: 3011
      CLIWEB_BREW_PREFIX: /home/linuxbrew/.linuxbrew
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      SHELL: /bin/bash
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # User-local package installs are written below /home/cliweb, which is a
      # named volume and therefore survives container recreation and rebuilds.
      NPM_CONFIG_PREFIX: /home/cliweb/.local
      PIP_USER: "1"
      PYTHONUSERBASE: /home/cliweb/.local
    ports:
      # Localhost-only is the safe default. Set HOST_BIND=0.0.0.0 only when
      # you intentionally want to reach the UI from another device.
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-3011}:3011"
    volumes:
      - cliweb_home:/home/cliweb
      - cliweb_brew:/home/linuxbrew/.linuxbrew
      - cliweb_brew:/home/cliweb/brew
      - cliweb_home:/mnt/cliweb-home:ro
      - ${WORKSPACE_DIR:-./workspaces}:/workspaces

volumes:
  cliweb_home:
    name: ${CLIWEB_HOME_VOLUME_NAME:-cliweb_home}
  cliweb_brew:
    name: ${CLIWEB_BREW_VOLUME_NAME:-cliweb_brew}
