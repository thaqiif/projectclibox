services:
  cliweb:
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      CLIWEB_PORT: 3011
      CLIWEB_NANOBREW_ROOT: /opt/nanobrew
      CLIWEB_NANOBREW_BIN: /usr/local/bin/nb
      CHROMIUM_PATH: /usr/bin/chromium
      NANOBREW_NO_TELEMETRY: "1"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      SHELL: /bin/bash
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # User-local package installs and nanobrew state are written below the
      # host bind mount and therefore survive container recreation and rebuilds.
      NPM_CONFIG_PREFIX: /home/cliweb/.local
      NPM_CONFIG_USERCONFIG: /home/cliweb/.npmrc
      PIP_USER: "1"
      PYTHONUSERBASE: /home/cliweb/.local
    ports:
      # Localhost-only is the safe default. Set HOST_BIND=0.0.0.0 only when
      # you intentionally want to reach the UI from another device.
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-3011}:3011"
    extra_hosts:
      # Linux does not provide host.docker.internal automatically. This lets
      # CLIWeb call APIs from sibling containers through their host ports.
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: /home/cliweb
        target: /home/cliweb
        bind:
          create_host_path: true
      - type: bind
        source: /home/cliweb/nanobrew
        target: /opt/nanobrew
        bind:
          create_host_path: true
      - ${WORKSPACE_DIR:-./workspaces}:/workspaces

    # Pass host devices through so web terminals can use hardware features.
    # /dev/kvm: hardware virtualization (QEMU/KVM guests, Android emulators,
    # microVMs, …). Requires /dev/kvm on the host; remove this line on hosts
    # that lack it.
    # /dev/dri: GPU render/display nodes for ffmpeg VA-API/QSV/VAAPI transcode
    # (Intel HD 620-class via iHD, AMD amdgpu via radeonsi) and Vulkan/OpenGL.
    # Requires /dev/dri on the host; remove this line on hosts without a GPU.
    # The entrypoint grants the unprivileged `cliweb` user access to every
    # DRI node (card*, renderD*), so multi-GPU hosts (e.g. virtio-gpu +
    # amdgpu) work without hardcoding card0/renderD128.
    # /dev/kfd: AMD ROCm/OpenCL compute node (amdgpu hosts only). Requires
    # /dev/kfd on the host; remove this line on hosts without an AMD GPU.
    # Docker fails the deploy if a mapped host path is missing.
    devices:
      - /dev/kvm:/dev/kvm
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd

  tailscale:
    image: tailscale/tailscale:v1.94.1@sha256:21df0b5a84efa35c0a507f4dd2340e1b1295683634a28968707354d5bd991d9c
    depends_on:
      cliweb:
        condition: service_started
    network_mode: service:cliweb
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/tailscaled"]
    command:
      - "--state=/var/lib/tailscale/tailscaled.state"
      - "--socket=/tmp/tailscaled.sock"
      - "--tun=tailscale0"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - type: bind
        source: /var/lib/cliweb-tailscale
        target: /var/lib/tailscale
        bind:
          create_host_path: true
