services:
  cliweb:
    build:
      context: .
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    mem_limit: ${CONTAINER_MEMORY_LIMIT:-4g}
    cpus: ${CONTAINER_CPUS:-4.0}
    pids_limit: ${CONTAINER_PIDS_LIMIT:-1024}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    env_file:
      - path: .env
        required: false
    environment:
      PCLX_BIND: 0.0.0.0
      PCLX_PORT: 3011
      PCLX_STATIC_DIR: /opt/projectclibox/frontend/dist
      PCLX_WORKSPACE_ROOT: /workspaces
      DB_PATH: /home/cliweb/.cliweb/projectclibox.db
      # The container listener is non-loopback, so Compose explicitly opts in
      # to edge-only mode. The host port remains localhost-only by default.
      # Set this to false when using PROJECTCLIBOX_AUTH_TOKEN instead.
      PCLX_ALLOW_UNAUTHENTICATED_NON_LOOPBACK: ${PCLX_ALLOW_UNAUTHENTICATED_NON_LOOPBACK:-true}
      # Optional: when set, token auth remains enabled and takes precedence
      # over edge-only mode. It is intentionally not required.
      PROJECTCLIBOX_AUTH_TOKEN: ${PROJECTCLIBOX_AUTH_TOKEN:-}
      CLIWEB_NANOBREW_ROOT: /opt/nanobrew
      CLIWEB_NANOBREW_BIN: /usr/local/bin/nb
      NANOBREW_NO_TELEMETRY: "1"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      SHELL: /bin/bash
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # User-local package installs and nanobrew state are written below the
      # host bind mount and therefore survive container recreation and rebuilds.
      NPM_CONFIG_PREFIX: /home/cliweb/.local
      NPM_CONFIG_USERCONFIG: /home/cliweb/.npmrc
      PIP_USER: "1"
      PYTHONUSERBASE: /home/cliweb/.local
    ports:
      # Localhost-only is the safe default. Set HOST_BIND=0.0.0.0 only when
      # you intentionally want to reach the UI from another device.
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-3011}:3011"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3011/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    extra_hosts:
      # Linux does not provide host.docker.internal automatically. This lets
      # CLIWeb call APIs from sibling containers through their host ports.
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: /home/cliweb
        target: /home/cliweb
        bind:
          create_host_path: true
      - type: bind
        source: /home/cliweb/nanobrew
        target: /opt/nanobrew
        bind:
          create_host_path: true
      - ${WORKSPACE_DIR:-./workspaces}:/workspaces
