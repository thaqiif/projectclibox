# Force Chromium onto the AMD GPU (RADV/Vulkan via ANGLE).
# Without these, headless Chromium falls back to SwiftShader (CPU).
# On hosts without a Vulkan device Chromium degrades gracefully to
# SwiftShader — same behaviour as the stock defaults.
export CHROMIUM_FLAGS="$CHROMIUM_FLAGS --use-angle=vulkan --enable-features=Vulkan"
